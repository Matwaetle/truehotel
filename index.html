<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17211b">
  <title>TRUE REVIEW · HotelHansung</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-stone-100 text-stone-900 antialiased">
  <div class="min-h-screen lg:grid lg:grid-cols-[18rem_1fr]">
    <aside class="border-b border-stone-700 bg-[#17211b] px-5 py-5 text-stone-50 lg:min-h-screen lg:border-b-0 lg:border-r">
      <a href="/" class="inline-flex min-h-11 items-center text-lg font-black tracking-[0.18em]">TRUE REVIEW</a>
      <p class="mt-1 text-xs text-stone-400">A trust layer for the synthetic web</p>

      <nav class="mt-8" aria-label="플랫폼">
        <p class="mb-2 text-[0.7rem] font-bold uppercase tracking-[0.2em] text-stone-500">Platform</p>
        <button type="button" class="flex min-h-11 w-full items-center gap-3 rounded-xl bg-white/10 px-4 text-left font-semibold ring-1 ring-white/10">
          <span aria-hidden="true">H</span>
          HotelHansung
        </button>
      </nav>

      <a href="/check.html" class="mt-8 inline-flex min-h-11 items-center text-sm text-stone-400 underline decoration-stone-600 underline-offset-4">연결 진단 열기</a>
    </aside>

    <main class="mx-auto w-full max-w-5xl px-5 py-8 sm:px-8 lg:py-12">
      <header class="max-w-2xl">
        <p class="text-xs font-black uppercase tracking-[0.22em] text-emerald-800">HotelHansung</p>
        <h1 class="mt-3 text-3xl font-black tracking-tight sm:text-5xl">믿을 사람을 고르면<br>리뷰가 달라집니다.</h1>
        <p class="mt-4 text-base leading-7 text-stone-600">AI가 쓴 문장보다 사람 사이의 신뢰를 먼저 보여주는 호텔 리뷰 실험입니다.</p>
      </header>

      <section class="mt-10 grid gap-4 sm:grid-cols-2" aria-label="앱 준비 상태">
        <article class="rounded-2xl border border-stone-200 bg-white p-5 shadow-sm">
          <p class="text-xs font-bold uppercase tracking-[0.16em] text-stone-500">Session</p>
          <h2 id="session-title" class="mt-3 text-lg font-bold">Firebase 연결 중</h2>
          <p id="session-detail" class="mt-2 text-sm leading-6 text-stone-600" aria-live="polite">인증 상태와 사용자 문서를 확인하고 있습니다.</p>
        </article>

        <article class="rounded-2xl border border-stone-200 bg-white p-5 shadow-sm">
          <p class="text-xs font-bold uppercase tracking-[0.16em] text-stone-500">Next</p>
          <h2 class="mt-3 text-lg font-bold">리뷰 데이터 준비 중</h2>
          <p class="mt-2 text-sm leading-6 text-stone-600">호텔 검색, 신뢰 필터, 리뷰 작성 화면이 단계별로 연결됩니다.</p>
        </article>
      </section>
    </main>
  </div>

  <script type="module">
    import { subscribeSession } from './app/session.js';

    const title = document.getElementById('session-title');
    const detail = document.getElementById('session-detail');

    subscribeSession((session) => {
      const copy = {
        loading: ['Firebase 연결 중', '인증 상태를 확인하고 있습니다.'],
        syncing: ['사용자 준비 중', '로그인 계정의 프로필 문서를 보장하고 있습니다.'],
        anonymous: ['연결 완료', '로그인하지 않은 상태입니다.'],
        authenticated: ['연결 완료', `${session.profile?.nickname || '사용자'} 계정이 준비됐습니다.`],
        error: ['연결 오류', '사용자 초기화에 실패했습니다. 연결 진단 페이지를 확인하세요.']
      }[session.status];

      title.textContent = copy[0];
      detail.textContent = copy[1];
    });
  </script>
</body>
</html>
